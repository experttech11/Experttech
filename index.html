    <!-- Global Asset Error Handler & Auto-Recovery for In-App WebViews (WhatsApp) -->
    <script>
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('[AppLoader] Asset loading error detected in webview:', e);
          var key = 'app_reload_asset_err';
          var lastReload = 0;
          try { lastReload = Number(sessionStorage.getItem(key) || 0); } catch(err) {}
          var now = Date.now();
          if (now - lastReload > 10000) {
            try { sessionStorage.setItem(key, String(now)); } catch(err) {}
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
            window.location.reload();
          }
        }
      }, true);
    </script>
